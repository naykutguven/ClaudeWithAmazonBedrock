[project]
name = "claudewithamazonbedrock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aykut Güven", email = "naykutguven@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic[bedrock]>=1.11.0",
    "boto3>=1.43.108",
    "python-dotenv>=1.2.4",
]

[project.scripts]
claudewithamazonbedrock = "claudewithamazonbedrock:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
